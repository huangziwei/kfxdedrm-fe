# Attaches kfxdedrm-fe-<tag>-kindle.zip and kfxdedrm-koplugin-<tag>.zip to a
# published release. The tag matches [workspace.package] in Cargo.toml.
# `workflow_dispatch` builds and attaches nothing.

name: Release

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            # `awk` reads the [workspace.package] key and no other `version =`.
            - name: Check the tag against Cargo.toml
              if: github.event_name == 'release'
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  crate=$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0}
                               f && /^version *=/{gsub(/[" ]/,""); sub(/^version=/,""); print; exit}' \
                      Cargo.toml)
                  if [ "$crate" != "${TAG#v}" ]; then
                    echo "error: release $TAG does not match Cargo.toml $crate" >&2
                    exit 1
                  fi
                  echo "version $crate"

            # build.sh checks for these and stops with one line.
            - name: Install the cross targets
              run: rustup target add armv7-unknown-linux-musleabihf armv7-unknown-linux-musleabi

            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

            # `run.sh` fetches the two release archives into koplugin/spec/cache/,
            # which native/tests/real_archives.rs reads in the step below.
            - name: Test the KOReader plugin
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends luajit
                  ./koplugin/spec/run.sh

            - name: Format, lint, test
              run: |
                  cargo fmt --all --check
                  cargo clippy --workspace --all-targets -- -D warnings
                  cargo test --workspace

            # One run per float ABI, into the same bin/.
            - name: Build the device tree
              run: |
                  ./build.sh armhf
                  ./build.sh armsf

            - name: Package
              id: package
              env:
                  VERSION: ${{ github.event.release.tag_name || github.ref_name }}
              run: |
                  # `tr / -` keeps a branch like feat/x naming a file.
                  name="kfxdedrm-fe-$(echo "$VERSION" | tr / -)-kindle"
                  # From inside device/, naming the two paths that go to /mnt/us.
                  (cd device && zip -qr "$RUNNER_TEMP/$name.zip" extensions documents -x '*.DS_Store')
                  # Both `kfxdedrm-fe` and `kfxdedrm-fe-armsf`, or no asset.
                  for abi in kfxdedrm-fe kfxdedrm-fe-armsf; do
                    unzip -Z1 "$RUNNER_TEMP/$name.zip" \
                      | grep -qx "extensions/kfxdedrm-fe/bin/$abi" \
                      || { echo "error: $abi is not in $name.zip" >&2; exit 1; }
                  done
                  # LICENSE at the archive root.
                  zip -q "$RUNNER_TEMP/$name.zip" LICENSE
                  # From inside RUNNER_TEMP: the sidecar names the zip alone.
                  (cd "$RUNNER_TEMP" && sha256sum "$name.zip" > "$name.zip.sha256")
                  echo "name=$name" >> "$GITHUB_OUTPUT"

                  # From inside koplugin/: the archive opens onto
                  # kfxdedrm.koplugin/, and spec/ stays out.
                  ko="kfxdedrm-koplugin-$(echo "$VERSION" | tr / -)"
                  (cd koplugin && zip -qr "$RUNNER_TEMP/$ko.zip" kfxdedrm.koplugin -x '*.DS_Store')
                  zip -q "$RUNNER_TEMP/$ko.zip" LICENSE
                  (cd "$RUNNER_TEMP" && sha256sum "$ko.zip" > "$ko.zip.sha256")
                  echo "ko=$ko" >> "$GITHUB_OUTPUT"
                  ls -lh "$RUNNER_TEMP/$name.zip" "$RUNNER_TEMP/$ko.zip"

            # `--clobber` replaces an asset of the same name.
            - name: Attach to the release
              if: github.event_name == 'release'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event.release.tag_name }}
                  NAME: ${{ steps.package.outputs.name }}
                  KO: ${{ steps.package.outputs.ko }}
              run: |
                  gh release upload "$TAG" \
                    "$RUNNER_TEMP/$NAME.zip" \
                    "$RUNNER_TEMP/$NAME.zip.sha256" \
                    "$RUNNER_TEMP/$KO.zip" \
                    "$RUNNER_TEMP/$KO.zip.sha256" \
                    --clobber

            - name: Keep the tree from a manual run
              if: github.event_name != 'release'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.package.outputs.name }}
                  path: |
                      device/extensions
                      device/documents
                      koplugin/kfxdedrm.koplugin
