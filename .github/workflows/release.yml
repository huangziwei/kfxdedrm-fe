# Attaches the install tree to a published release.
#
#   Releases -> Draft a new release -> tag v0.1.0 -> Publish
#
# The `release: published` trigger fires this, not a tag push. `--clobber`
# replaces an asset of the same name, leaving a failed run safe to re-run from
# the Actions tab.
#
# The tag matches [workspace.package] in Cargo.toml. That version compiles in
# as CARGO_PKG_VERSION and appears in the startup line in
# /mnt/us/logs/kfxdedrm-fe.log.
#
# A runner needs the cross target and luajit, and nothing else: no sysroot, no
# C toolchain. build.sh is the script a workstation runs. The zips are made here
# alone -- one for the standalone app, one for the KOReader plugin.

name: Release

on:
    release:
        types: [published]
    # For a dry run on a branch: builds, and attaches nothing to anything.
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            # Section-aware, matching build.sh: compares the
            # [workspace.package] key and no other `version =`.
            - name: Check the tag against Cargo.toml
              if: github.event_name == 'release'
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  crate=$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0}
                               f && /^version *=/{gsub(/[" ]/,""); sub(/^version=/,""); print; exit}' \
                      Cargo.toml)
                  if [ "$crate" != "${TAG#v}" ]; then
                    echo "error: release $TAG does not match Cargo.toml $crate" >&2
                    exit 1
                  fi
                  echo "version $crate"

            # build.sh checks for this and stops with one line.
            - name: Install the cross target
              run: rustup target add armv7-unknown-linux-musleabihf

            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

            - name: Format, lint, test
              run: |
                  cargo fmt --all --check
                  cargo clippy --workspace --all-targets -- -D warnings
                  cargo test --workspace

            - name: Build the device tree
              run: ./build.sh

            # The plugin's suite is plain LuaJIT over stubbed KOReader
            # modules; `unzip` for its archive reader is already on the runner.
            - name: Test the KOReader plugin
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends luajit
                  ./koplugin/spec/run.sh

            - name: Package
              id: package
              env:
                  VERSION: ${{ github.event.release.tag_name || github.ref_name }}
              run: |
                  # One asset: the build takes no model. `tr / -` keeps a
                  # branch like feat/x naming a file.
                  name="kfxdedrm-fe-$(echo "$VERSION" | tr / -)-kindle"
                  # Zipped from inside device/: the archive opens onto
                  # extensions/ and documents/, the two that go to /mnt/us.
                  # assets/ and make-tile.sh build the tile icon and stay out.
                  (cd device && zip -qr "$RUNNER_TEMP/$name.zip" extensions documents -x '*.DS_Store')
                  # GPLv3 conveys the license with the object code. At the
                  # archive root, leaving /mnt/us as it was.
                  zip -q "$RUNNER_TEMP/$name.zip" LICENSE
                  # From inside RUNNER_TEMP: the sidecar names the zip alone
                  # and `sha256sum -c` works where the two land.
                  (cd "$RUNNER_TEMP" && sha256sum "$name.zip" > "$name.zip.sha256")
                  echo "name=$name" >> "$GITHUB_OUTPUT"

                  # The KOReader plugin, the repository's other frontend. Zipped
                  # from inside koplugin/ so the archive opens onto
                  # kfxdedrm.koplugin/, which is what goes into
                  # koreader/plugins/. spec/ is the host suite and stays out.
                  ko="kfxdedrm-koplugin-$(echo "$VERSION" | tr / -)"
                  (cd koplugin && zip -qr "$RUNNER_TEMP/$ko.zip" kfxdedrm.koplugin -x '*.DS_Store')
                  zip -q "$RUNNER_TEMP/$ko.zip" LICENSE
                  (cd "$RUNNER_TEMP" && sha256sum "$ko.zip" > "$ko.zip.sha256")
                  echo "ko=$ko" >> "$GITHUB_OUTPUT"
                  ls -lh "$RUNNER_TEMP/$name.zip" "$RUNNER_TEMP/$ko.zip"

            # `--clobber` replaces an asset of the same name.
            - name: Attach to the release
              if: github.event_name == 'release'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event.release.tag_name }}
                  NAME: ${{ steps.package.outputs.name }}
                  KO: ${{ steps.package.outputs.ko }}
              run: |
                  gh release upload "$TAG" \
                    "$RUNNER_TEMP/$NAME.zip" \
                    "$RUNNER_TEMP/$NAME.zip.sha256" \
                    "$RUNNER_TEMP/$KO.zip" \
                    "$RUNNER_TEMP/$KO.zip.sha256" \
                    --clobber

            - name: Keep the tree from a manual run
              if: github.event_name != 'release'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.package.outputs.name }}
                  path: |
                      device/extensions
                      device/documents
                      koplugin/kfxdedrm.koplugin
